[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotitermy"
version = "0.1.0"
description = "Catppuccin-themed Spotify terminal UI with AI playlist curation (spotagen integration)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "spotitermy" }]
dependencies = [
    "textual>=0.78",
    "spotipy>=2.23",
    "rich>=13.0",
    "platformdirs>=4.0",
    "typer>=0.12",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.28",
    "openai>=1.30",
]

[project.scripts]
spotitermy = "spotitermy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["spotitermy"]
